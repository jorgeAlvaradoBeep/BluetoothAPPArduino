# Daemon JVM criteria (Gradle 8.8+).
# Define la JVM con la que se ejecuta el daemon de Gradle.
# Si no hay un JDK 17 instalado, Gradle lo descarga automaticamente.
# Alinea la seleccion de JVM entre la CLI y el IDE -> menos daemons,
# mejor rendimiento y reproducibilidad entre maquinas.
toolchainVersion=17
